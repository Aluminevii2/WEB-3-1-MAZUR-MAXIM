<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercițiul 5</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="pagina">
    <a class="inapoi" href="index.html">&larr; Înapoi</a>
    <h1>CATALOG ELECTRONIC</h1>

    <div class="bloc">
      <div class="contor" id="contor"></div>
      <div id="catalog"></div>
    </div>

    <div class="bloc">
      <h2>Adaugă elev</h2>
      Nume: <input type="text" id="nume"><br>
      Vârsta: <input type="number" id="varsta"><br>
      Nota: <input type="number" id="nota" min="1" max="10"><br>
      <button onclick="adaugaElev()">Adaugă elev</button>
    </div>

    <div class="bloc">
      <h2>Șterge elev</h2>
      Numele elevului: <input type="text" id="numeSters">
      <button class="rosu" onclick="stergeElev()">Șterge elev</button>
    </div>

    <div class="bloc">
      <h2>Caută elev</h2>
      Caută elev: <input type="text" id="numeCautat">
      <button onclick="cautaElev()">Caută</button>
      <div class="rezultat" id="rezultat"></div>
    </div>
  </div>
  <script src="lab_5.js"></script>
</body>
</html>
